<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' https://telegram.org; 
                   style-src 'self' 'unsafe-inline'; 
                   img-src * data: blob:; 
                   connect-src 'self' https://api.telegra.ph https://api.allorigins.win;
                   frame-src 'none';">
    <title>📖 Читалка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
    <!-- Загрузка -->
    <div id="loader">
        <div class="spinner"></div>
        <p>Загрузка главы…</p>
    </div>

    <!-- Контент главы -->
    <article id="reader" hidden>
        <h1 id="chapter-title"></h1>
        <div id="chapter-content"></div>
    </article>

    <!-- Ошибка -->
    <div id="error-screen" hidden>
        <div class="error-icon">⚠️</div>
        <h2 id="error-title">Не удалось загрузить</h2>
        <p id="error-message"></p>
        <button id="retry-btn" class="btn">🔄 Попробовать снова</button>
        <button id="open-external-btn" class="btn btn-secondary">🌐 Открыть в браузере</button>
    </div>

    <!-- ==================== Закладка ==================== -->
    <div id="bookmark-overlay"></div>

    <div id="bookmark-menu">
        <div
            class="bookmark-header"
            id="bookmark-title"
        >
            Параграф
        </div>

        <div
            class="bookmark-option"
            id="btn-add-bookmark"
            role="button"
            tabindex="0"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"
                />
            </svg>

            <span id="bookmark-btn-text">
                Сохранить закладку
            </span>
        </div>
    </div>

    <!-- ==================== Сноска ==================== -->
    <div
        id="footnote-modal"
        aria-hidden="true"
    >
        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="footnote-title"
        >
            <div id="footnote-title"></div>

            <div id="footnote-text"></div>

            <button
                id="footnote-close"
                class="btn"
                type="button"
            >
                Закрыть
            </button>
        </div>
    </div>

    <script src="reader.js?v=8"></script>
</body>
</html>
