<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' https://telegram.org; 
                   style-src 'self' 'unsafe-inline'; 
                   img-src * data: blob:; 
                   connect-src 'self' https://api.telegra.ph https://api.allorigins.win;
                   frame-src 'none';">
    <title>📖 Читалка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
    <!-- Загрузка -->
    <div id="reader-progress-bar" aria-hidden="true"></div>

    <div id="loader">
        <div class="loader-icon">📖</div>
        <p class="loader-text">
            Загрузка главы
            <span class="loader-dots">
                <span>.</span><span>.</span><span>.</span>
            </span>
        </p>
    </div>

    <!-- Контент главы -->
    <article id="reader" hidden>
        <h1 id="chapter-title"></h1>
        <div class="reader-settings-row">
            <button
                id="reader-settings-button"
                class="reader-settings-button"
                type="button"
                aria-label="Настройки чтения"
                title="Настройки чтения"
                hidden
            >
                Aa
            </button>
        </div>
        <div id="chapter-content"></div>
    </article>

    <!-- Ошибка -->
    <div id="error-screen" hidden>
        <div class="error-icon">⚠️</div>
        <h2 id="error-title">Не удалось загрузить</h2>
        <p id="error-message"></p>
        <button id="retry-btn" class="btn">🔄 Попробовать снова</button>
        <button id="open-external-btn" class="btn btn-secondary">🌐 Открыть в браузере</button>
    </div>

    <!-- ==================== Закладка ==================== -->
    <div id="bookmark-overlay"></div>

    <div id="bookmark-menu">
        <div
            class="bookmark-header"
            id="bookmark-title"
        >
            Параграф
        </div>

        <div
            class="bookmark-option"
            id="btn-add-bookmark"
            role="button"
            tabindex="0"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"
                />
            </svg>

            <span id="bookmark-btn-text">
                Сохранить закладку
            </span>
        </div>
    </div>

    <!-- ==================== Сноска ==================== -->
    <div
        id="footnote-modal"
        aria-hidden="true"
    >
        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="footnote-title"
        >
            <div id="footnote-title"></div>

            <div id="footnote-text"></div>

            <button
                id="footnote-close"
                class="btn"
                type="button"
            >
                Закрыть
            </button>
        </div>
    </div>

    <!-- ==================== Настройки чтения ==================== -->
    <div id="reader-settings-overlay"></div>

    <div
        id="reader-settings-menu"
        aria-hidden="true"
    >
        <div class="reader-settings-handle"></div>

        <div class="reader-settings-header">
            Настройки чтения
        </div>

        <!-- Шрифт -->
        <div class="reader-setting-block">
            <label
                class="reader-setting-label"
                for="reader-font"
            >
                Шрифт
            </label>

            <select
                id="reader-font"
                class="reader-setting-select"
            >
                <option value="system">
                    Системный
                </option>

                <option value="georgia">
                    Georgia
                </option>

                <option value="times">
                    Times New Roman
                </option>

                <option value="arial">
                    Arial
                </option>
            </select>
        </div>

        <!-- Размер -->
        <div class="reader-setting-block">
            <div class="reader-setting-row">
                <label
                    class="reader-setting-label"
                    for="reader-font-size"
                >
                    Размер текста
                </label>

                <span
                    id="reader-font-size-value"
                    class="reader-setting-value"
                ></span>
            </div>

            <div class="reader-range-row">
                <span class="reader-range-edge">
                    A−
                </span>

                <input
                    id="reader-font-size"
                    class="reader-range"
                    type="range"
                    min="14"
                    max="28"
                    step="1"
                >

                <span class="reader-range-edge reader-range-edge-big">
                    A+
                </span>
            </div>
        </div>

        <!-- Межстрочный интервал -->
        <div class="reader-setting-block">
            <div class="reader-setting-row">
                <label
                    class="reader-setting-label"
                    for="reader-line-height"
                >
                    Межстрочный интервал
                </label>

                <span
                    id="reader-line-height-value"
                    class="reader-setting-value"
                ></span>
            </div>

            <input
                id="reader-line-height"
                class="reader-range"
                type="range"
                min="1.3"
                max="2.2"
                step="0.1"
            >
        </div>

        <!-- Абзац -->
        <div class="reader-setting-block reader-setting-row">
            <div>
                <div class="reader-setting-label">
                    Абзацный отступ
                </div>

                <div class="reader-setting-description">
                    Отступ первой строки абзаца
                </div>
            </div>

            <label class="reader-switch">
                <input
                    id="reader-indent"
                    type="checkbox"
                >

                <span class="reader-switch-slider"></span>
            </label>
        </div>

        <!-- Тема -->
        <div class="reader-setting-block">
            <div class="reader-setting-label">
                Тема
            </div>

            <div
                id="reader-theme-buttons"
                class="reader-theme-buttons"
            >
                <button
                    type="button"
                    class="reader-theme-button"
                    data-reader-theme="light"
                >
                    ☀️ Светлая
                </button>

                <button
                    type="button"
                    class="reader-theme-button"
                    data-reader-theme="dark"
                >
                    🌙 Тёмная
                </button>

                <button
                    type="button"
                    class="reader-theme-button"
                    data-reader-theme="sepia"
                >
                    📜 Сепия
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== READER SCROLLBAR ==================== -->
    <div id="reader-scrollbar" aria-hidden="true" hidden>
        <div id="reader-scrollbar-track">
            <div id="reader-scrollbar-thumb"></div>
        </div>
    </div>

    
    <!-- ==================== IMAGE LIGHTBOX ==================== -->
    <div id="reader-image-lightbox" hidden aria-hidden="true">
        <div class="reader-image-lightbox-backdrop"></div>
        <img id="reader-image-lightbox-image" src="" alt="" draggable="false">
        <button id="reader-image-lightbox-close" type="button" aria-label="Закрыть изображение">×</button>
    </div>

    <script src="reader.js?v=19"></script>
</body>
</html>
